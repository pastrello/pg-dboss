[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-dboss"
version = "0.1.0"
description = "DBOSS: PostgreSQL 18 intelligence, Linux/OpenZFS monitoring and legacy PG Intelligence"
requires-python = ">=3.9"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
dboss = "dboss.cli:main"
dbos = "dbos.cli:main"
pgintel = "pgintel.cli:main"

[tool.setuptools.packages.find]
include = ["dboss*", "dbos*", "pgintel*"]
exclude = ["tests*"]
